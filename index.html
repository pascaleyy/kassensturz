<style>
/* Layout: einspaltige Handy-App wie ein Kassenbuch, Inhalt oben, feste Tab-Leiste unten */
:root{
  --bg:#ECEFEB; --surface:#FFFFFF; --sunk:#E2E7E2; --ink:#141B18; --muted:#5A6761; --line:#D2D9D4;
  --accent:#3245C8; --accent-ink:#FFFFFF; --accent-soft:#E3E6FA;
  --good:#22774E; --warn:#A86E12; --bad:#BF3E37;
  --c0:#4C6FE0; --c1:#E07A3F; --c2:#2E9C77; --c3:#C84F8E; --c4:#C9A020; --c5:#7C5BD6; --c6:#3A9FC0; --c7:#8A928E; --c8:#D0573F; --c9:#5A8F2E; --c10:#B0608F; --c11:#2F7FA8;
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#171C1A; --sunk:#202724; --ink:#E5EAE7; --muted:#93A09A; --line:#2B3430;
  --accent:#909EFF; --accent-ink:#0E1210; --accent-soft:#232A4E;
  --good:#5CC08D; --warn:#E3AA4C; --bad:#F07B72; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#171C1A; --sunk:#202724; --ink:#E5EAE7; --muted:#93A09A; --line:#2B3430;
  --accent:#909EFF; --accent-ink:#0E1210; --accent-soft:#232A4E;
  --good:#5CC08D; --warn:#E3AA4C; --bad:#F07B72; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.02em}
.small{font-size:13px}

.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* Hero */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,12vw,54px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--bad)}

/* Banner */
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}

/* Flow-Balken */
.flow{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.flow span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend .lbl{flex:1;min-width:0;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* Budgetzeilen */
.rows{display:flex;flex-direction:column;gap:14px}
.brow{display:flex;flex-direction:column;gap:6px}
.brow-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.brow-top .name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:4px}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

/* Kategorien-Balken */
.cbar{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;gap:10px;align-items:center;font-size:14px}
.cbar .bar{height:14px;border-radius:4px;background:var(--sunk);overflow:hidden}
.cbar .bar i{display:block;height:100%;border-radius:4px}
.cbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Wochen-Säulen */
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding-top:18px;position:relative}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.wk .col{width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.35;position:relative;min-height:3px}
.wk.now .col{opacity:1}
.wk .v{font-size:11px;color:var(--muted);white-space:nowrap}
.wk .k{font-size:11.5px;color:var(--muted);font-weight:600}
.wk.now .k{color:var(--ink)}

/* Listen */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .txt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .txt span{font-size:12.5px;color:var(--muted)}
.day-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:14px 0 2px;display:flex;justify-content:space-between}

/* Formulare */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.amount-in{font-family:var(--f-display);font-size:34px;font-weight:700;padding:8px 12px;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;cursor:pointer;background:var(--surface)}
.chips input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--sunk);color:var(--ink)}
.btn-line{background:transparent;color:var(--accent);border:1px dashed var(--line);width:100%}
.btn-danger{background:var(--bad);color:#fff}
.x{background:transparent;color:var(--muted);padding:6px 8px;font-size:18px;line-height:1;border-radius:8px;flex:none}
.x.armed{background:var(--bad);color:#fff;font-size:12.5px;padding:6px 10px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Plan-Editor */
.erow{display:grid;grid-template-columns:1fr 6.5em auto;gap:8px;align-items:center}
.erow.sub{grid-template-columns:1fr 5.8em 5.6em auto}
.erow input,.erow select{padding:9px 10px;font-size:15px}
.erow .money{text-align:right;font-family:var(--f-num)}
.sumline{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px;border-top:1px solid var(--line);font-weight:600}

/* Rechnung im Plan */
.calc{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.calc div{display:flex;justify-content:space-between;gap:12px}
.calc .tot{border-top:1.5px solid var(--ink);padding-top:6px;font-weight:700}

/* Tipps */
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.tip:first-child{border-top:0;padding-top:0}
.tip .mark{width:6px;align-self:stretch;border-radius:3px;flex:none}
.tip p{font-size:14.5px}
.tip b{font-weight:600}

.ratio{display:flex;flex-direction:column;gap:12px}
.rline{display:flex;flex-direction:column;gap:6px}
.rtrack{height:10px;border-radius:5px;background:var(--sunk);position:relative;overflow:visible}
.rtrack i{display:block;height:100%;border-radius:5px;max-width:100%}
.rtrack em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}

.ideas{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.ideas li{display:flex;flex-direction:column;gap:2px}
.ideas b{font-weight:600}
.ideas span{font-size:14px;color:var(--muted)}

.goalpct{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,13vw,60px);line-height:1;letter-spacing:-.03em;color:var(--good)}
.goalbar{height:20px;border-radius:10px;background:var(--sunk);position:relative;overflow:hidden}
.goalbar i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--good) 70%,var(--surface)),var(--good));transition:width .6s ease}
.goalbar b{position:absolute;top:4px;bottom:4px;width:2px;border-radius:1px;background:color-mix(in srgb,var(--ink) 25%,transparent)}
.goalbar b.hit{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.miles{display:grid;grid-template-columns:repeat(4,1fr);font-size:11.5px;color:var(--muted);text-align:right;font-weight:600}
.miles span.hit{color:var(--good)}
.tog{background:var(--sunk);color:var(--muted);padding:8px 10px;font-size:13px;border-radius:9px}
.tog.on{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
details.edit summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none}
details.edit summary::-webkit-details-marker{display:none}
details.edit[open] summary{margin-bottom:12px}
details.edit .inner{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion: reduce){.goalbar i{transition:none}}
.tap{cursor:pointer;border-radius:12px;margin:-8px;padding:8px;transition:background .15s}
.tap:hover,.tap:focus-visible{background:var(--sunk);outline:none}
.tap:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.chev{color:var(--muted);font-size:18px;line-height:1;margin-left:2px}
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .back{position:absolute;inset:0;background:rgba(10,14,12,.45);animation:fade .2s}
.sheet .panel{position:relative;background:var(--surface);border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;padding-top:10px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .25s ease;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet .panel,.sheet .back{animation:none}}
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:17px}
.mbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;position:relative;padding-top:22px}
.mbars .wk{height:auto}
.mbars .k{line-height:15px}
.mbars .line{position:absolute;left:0;right:0;border-top:2px dashed var(--bad);opacity:.7}
.mbars .line span{position:absolute;left:0;top:-9px;background:var(--surface);padding:0 6px 0 0;line-height:16px;font-size:11px;color:var(--bad);font-weight:600}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:8px 0}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:380px){.legend{grid-template-columns:1fr}.erow.sub{grid-template-columns:1fr 5.4em auto}.erow.sub select{grid-column:1 / 2}}
</style>
</head>

<script>
(function(){
const KEY='kassensturz.v1';
const DEFAULT_CATS=['Lebensmittel','Essen gehen','Hobbys','Gaming','Shopping','Mobilität','Drogerie','Sonstiges'];
const NCOL=12;
const defCats=()=>DEFAULT_CATS.map((n,i)=>({id:Math.random().toString(36).slice(2,9),name:n,c:i}));
const catNames=()=>S.cats.map(c=>c.name);
const catColor=n=>{const c=S.cats.find(x=>x.name===n);return 'var(--c'+(c?c.c%NCOL:7)+')';};
const eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const eur0=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const money=v=>eur.format(v||0), money0=v=>eur0.format(Math.round(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
const monthly=s=>s.interval==='jahr'?(+s.amount||0)/12:(+s.amount||0);
function parseAmount(v){v=String(v).replace(/[^\d,.\-]/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?Math.round(n*100)/100:NaN;}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}
const monthName=d=>d.toLocaleDateString('de-DE',{month:'long'});

/* ---------- Daten ---------- */
function sample(){
  let seed=7;const r=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const rnd=(a,b)=>Math.round((a+r()*(b-a))*100)/100, pick=a=>a[Math.floor(r()*a.length)];
  const tx=[],today=new Date();
  const mk=(d,amount,cat,note)=>tx.push({id:uid(),date:iso(d),amount,cat,note});
  for(let i=0;i<45;i++){const d=addDays(today,-i);
    if(i%3===1)mk(d,rnd(22,58),'Lebensmittel',pick(['Rewe','Aldi','Lidl','Edeka']));
    if(i%5===2)mk(d,rnd(11,27),'Essen gehen',pick(['Döner','Lieferando','Pizza','Burger']));
    if(i%4===0)mk(d,rnd(2.5,6),'Essen gehen','Bäcker');
    if(i%7===4)mk(d,rnd(6,18),'Drogerie','dm');
    if([3,17,31].includes(i))mk(d,pick([9.99,19.99,4.99]),'Gaming',pick(['Battle Pass','Skin','Steam-Sale']));
    if([6,20,38].includes(i))mk(d,rnd(19,49),'Shopping',pick(['Hoodie','Amazon','Ladekabel']));
    if([2,9,23].includes(i))mk(d,rnd(8,30),'Hobbys',pick(['Kino','Bowling','Konzert']));
    if([12,27].includes(i))mk(d,rnd(8,20),'Sonstiges','Geschenk');
  }
  return {sample:true,
    income:[{id:uid(),name:'Gehalt (netto)',amount:1850}],
    fixed:[{id:uid(),name:'Miete warm',amount:620},{id:uid(),name:'Strom',amount:48},{id:uid(),name:'Internet',amount:35},{id:uid(),name:'Handyvertrag',amount:15},{id:uid(),name:'Deutschlandticket',amount:63},{id:uid(),name:'Haftpflicht',amount:6},{id:uid(),name:'Fitnessstudio',amount:29.9}],
    subs:[{id:uid(),name:'Spotify',amount:11.99,interval:'monat'},{id:uid(),name:'Netflix',amount:13.99,interval:'monat'},{id:uid(),name:'Game Pass',amount:14.99,interval:'monat'},{id:uid(),name:'iCloud+',amount:2.99,interval:'monat'},{id:uid(),name:'Amazon Prime',amount:89.9,interval:'jahr'}],
    budgets:[{id:uid(),cat:'Lebensmittel',amount:280},{id:uid(),cat:'Essen gehen',amount:90},{id:uid(),cat:'Hobbys',amount:60},{id:uid(),cat:'Gaming',amount:30},{id:uid(),cat:'Shopping',amount:70},{id:uid(),cat:'Drogerie',amount:35},{id:uid(),cat:'Sonstiges',amount:40}],
    tx, goal:{name:'Neuer PC',amount:1200,saved:150,by:iso(new Date(today.getFullYear(),today.getMonth()+8,1)).slice(0,7)}};
}
function blank(){return {sample:false,income:[],fixed:[],subs:[],cats:defCats(),budgets:DEFAULT_CATS.slice(0,4).map(c=>({id:uid(),cat:c,amount:0})),tx:[],paid:{},extra:[],debts:[],saves:[],goal:{name:'',amount:0,saved:0,by:''}};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tx)){const fix=o=>{if(o.cat==='Freizeit')o.cat='Hobbys';};s.tx.forEach(fix);(s.budgets||[]).forEach(fix);s.paid=s.paid||{};s.extra=s.extra||[];s.debts=s.debts||[];s.saves=s.saves||[];return s;}}catch(e){}return null;}
let S=load()||sample();S.paid=S.paid||{};S.extra=S.extra||[];S.debts=S.debts||[];S.saves=S.saves||[];S.goal=S.goal||{name:'',amount:0,saved:0,by:''};if(!Array.isArray(S.cats)||!S.cats.length)S.cats=defCats();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Berechnung ---------- */
function calc(){
  const now=new Date(), ym=iso(now).slice(0,7);
  const planned=sum(S.income), hasPaid=S.paid&&S.paid[ym]!=null, salary=hasPaid?+S.paid[ym]:planned, extraList=S.extra.filter(t=>t.date.startsWith(ym)), extra=sum(extraList), income=salary+extra, fixed=sum(S.fixed), subs=S.subs.reduce((s,x)=>s+monthly(x),0), budgets=sum(S.budgets);
  const monthTx=S.tx.filter(t=>t.date.startsWith(ym)), spent=sum(monthTx);
  const rates=S.debts.reduce((a,d)=>a+debtRate(d),0), planned2=S.debts.reduce((a,d)=>a+debtPlan(d,ym),0), debtTotal=S.debts.reduce((a,d)=>a+(+d.remaining||0),0);
  const saving=sum(S.saves), goalMonthly=sum(S.saves.filter(x=>x.goal));
  const free=income-fixed-subs-rates-planned2-saving, left=free-spent;
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), day=now.getDate(), daysLeft=dim-day+1;
  const byCat=(list)=>{const m={};list.forEach(t=>m[t.cat]=(m[t.cat]||0)+(+t.amount));return m;};
  const cut=iso(addDays(now,-29)), last30=S.tx.filter(t=>t.date>=cut&&t.date<=iso(now));
  const mon=addDays(now,-((now.getDay()+6)%7));
  const weeks=[];for(let w=5;w>=0;w--){const a=addDays(mon,-7*w),b=addDays(a,6);const ai=iso(a),bi=iso(b);weeks.push({kw:isoWeek(a),from:a,sum:sum(S.tx.filter(t=>t.date>=ai&&t.date<=bi)),now:w===0});}
  const hist=[];for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1),y=iso(d).slice(0,7);const inc=(S.paid&&S.paid[y]!=null)?+S.paid[y]:planned;const inc2=inc+sum(S.extra.filter(t=>t.date.startsWith(y)));const out=fixed+subs+S.debts.reduce((a,d)=>a+debtRate(d)+debtPlan(d,y),0)+sum(S.tx.filter(t=>t.date.startsWith(y)));hist.push({d,y,inc:inc2,out,now:k===0});}
  return {saving,goalMonthly,rates,planned2,debtTotal,now,ym,planned,hasPaid,hist,salary,extra,extraList,income,fixed,subs,budgets,spent,free,left,dim,day,daysLeft,perDay:left/daysLeft,catMonth:byCat(monthTx),last30,cat30:byCat(last30),sum30:sum(last30),weeks,buffer:free-budgets};
}

function dayLabel(ds){const t=iso(new Date()),y=iso(addDays(new Date(),-1));if(ds===t)return'Heute';if(ds===y)return'Gestern';return fromIso(ds).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});}
let armed=null;
function itemRow(t,withDel){return `<div class="item"><span class="dot" style="background:${catColor(t.cat)}"></span><div class="txt"><b>${esc(t.note||t.cat)}</b><span>${esc(t.note?t.cat:'')}${withDel?'':(t.note?' · ':'')+(withDel?'':dayLabel(t.date))}</span></div><span class="num">${money(t.amount)}</span>${withDel?`<button class="x${armed===t.id?' armed':''}" data-act="deltx" data-id="${t.id}" aria-label="Eintrag löschen">${armed===t.id?'Löschen':'×'}</button>`:''}</div>`;}

let lastCat='Lebensmittel', justAdded=null, prefill=null;

function editor(key,title,hint){

    if(key==='budgets')return `<div class="erow"><select data-k="${key}" data-id="${it.id}" data-f="cat" aria-label="Kategorie">${catNames().map(c=>`<option${c===it.cat?' selected':''}>${esc(c)}</option>`).join('')}</select><input class="money" inputmode="decimal" data-k="${key}" data-id="${it.id}" data-f="amount" value="${fmtIn(it.amount)}" aria-label="Betrag"><button class="x" data-act="delrow" data-k="${key}" data-id="${it.id}" aria-label="Zeile löschen">×</button></div>`;
    const sub=key==='subs';
    return `<div class="erow${sub?' sub':''}"><input data-k="${key}" data-id="${it.id}" data-f="name" value="${esc(it.name)}" placeholder="Name" aria-label="Name"><input class="money" inputmode="decimal" data-k="${key}" data-id="${it.id}" data-f="amount" value="${fmtIn(it.amount)}" placeholder="0,00" aria-label="Betrag">${sub?`<select data-k="${key}" data-id="${it.id}" data-f="interval" aria-label="Abrechnung"><option value="monat"${it.interval!=='jahr'?' selected':''}>/Monat</option><option value="jahr"${it.interval==='jahr'?' selected':''}>/Jahr</option></select>`:''}<button class="x" data-act="delrow" data-k="${key}" data-id="${it.id}" aria-label="Zeile löschen">×</button></div>`;}).join('');

}
function debtEditor(){
  const rows=S.debts.map(d=>`<div class="card" style="background:var(--bg);padding:12px;gap:10px">
    <div class="erow" style="grid-template-columns:1fr auto"><input data-debt="${d.id}" data-f="name" value="${esc(d.name)}" placeholder="Bei wem? z. B. Dispo, Ratenkauf, Kumpel" aria-label="Bei wem"><button class="x${armed==='debt'+d.id?' armed':''}" data-act="deldebt" data-id="${d.id}" aria-label="Schulden löschen">${armed==='debt'+d.id?'Löschen':'×'}</button></div>
    <div class="two" style="grid-template-columns:1fr 1fr 0.8fr"><label class="f">Noch offen €<input class="money num" inputmode="decimal" data-debt="${d.id}" data-f="remaining" value="${fmtIn(d.remaining)}" placeholder="0,00"></label><label class="f">Rate/Monat €<input class="money num" inputmode="decimal" data-debt="${d.id}" data-f="rate" value="${fmtIn(d.rate)}" placeholder="0,00"></label><label class="f">Zins %<input class="money num" inputmode="decimal" data-debt="${d.id}" data-f="zins" value="${fmtIn(d.zins)}" placeholder="0"></label></div>
    <div class="two"><label class="f">Geplante Einmalzahlung €<input class="money num" inputmode="decimal" data-debt="${d.id}" data-f="planAmount" value="${fmtIn(d.planAmount)}" placeholder="z. B. 500"></label><label class="f">Im Monat<input type="month" data-debt="${d.id}" data-f="planMonth" value="${esc(d.planMonth||'')}"></label></div>
    <p class="small muted" data-payoff="${d.id}">${payoffText(d)}</p>
    ${+d.remaining>0?`<div class="erow" style="grid-template-columns:1fr auto"><input class="money num" inputmode="decimal" id="pay-${d.id}" placeholder="Gezahlter Betrag €" aria-label="Gezahlter Betrag"><button class="btn-ghost" data-act="paycustom" data-id="${d.id}">Zahlung eintragen</button></div>`:''}
    ${+d.rate>0&&+d.remaining>0?`<button class="btn-ghost" data-act="payrate" data-id="${d.id}">Monatsrate gezahlt (− ${money(Math.min(d.rate,d.remaining))})</button>`:''}
  </div>`).join('');
  const total=S.debts.reduce((a,d)=>a+(+d.remaining||0),0), rates=S.debts.reduce((a,d)=>a+debtRate(d),0);
  return `<section class="card"><div class="card-head"><h2>Schulden</h2></div><p class="muted small">Kredite, Ratenkäufe, Dispo oder Geld, das du jemandem zurückzahlen musst. Die Raten werden wie Fixkosten von deinem Gehalt abgezogen. Den Zins findest du im Vertrag, bei Privatleuten einfach leer lassen. Zahlst du nicht monatlich, lass die Rate leer und plane eine Einmalzahlung, z. B. vom Weihnachtsgeld. Die wird dann in dem Monat wie eine Ausgabe vom Gehalt abgezogen.</p><div class="rows" style="gap:10px">${rows}</div>
  <button class="btn-line" data-act="adddebt">+ Schulden eintragen</button>
  <div class="sumline"><span>Offen gesamt</span><span class="num" data-dtotal>${money(total)}</span></div><div class="sumline" style="border:0;padding:0"><span>Raten pro Monat</span><span class="num" data-drates>${money(rates)}</span></div></section>`;
}
function catEditor(){
  const rows=S.cats.map(c=>{const n=S.tx.filter(t=>t.cat===c.name).length;return `<div class="erow" style="grid-template-columns:auto 1fr auto auto"><button class="x" data-act="cyclecolor" data-id="${c.id}" aria-label="Farbe ändern" style="padding:6px"><span class="dot" style="width:18px;height:18px;border-radius:6px;display:block;background:var(--c${c.c%NCOL})"></span></button><input data-cat="${c.id}" value="${esc(c.name)}" placeholder="Name" aria-label="Kategoriename"><span class="small muted num">${n}×</span><button class="x${armed==='cat'+c.id?' armed':''}" data-act="delcat" data-id="${c.id}" aria-label="Kategorie löschen">${armed==='cat'+c.id?'Löschen':'×'}</button></div>`;}).join('');
  return `<section class="card"><div class="card-head"><h2>Kategorien</h2></div><p class="muted small">Benenn sie um, wie du willst, oder leg neue an. Tipp auf den Farbpunkt, um die Farbe zu wechseln. Beim Löschen landen alte Einträge unter „Sonstiges“.</p><div class="rows" style="gap:8px">${rows}</div><button class="btn-line" data-act="addcat">+ Kategorie hinzufügen</button></section>`;
}
const debtRate=d=>(+d.remaining>0?Math.min(+d.rate||0,+d.remaining):0);
const debtPlan=(d,ym)=>(+d.remaining>0&&+d.planAmount>0&&d.planMonth===ym?Math.min(+d.planAmount,+d.remaining):0);
const ymLabel=ym=>{if(!ym)return '';const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});};
function payoff(d){const B=+d.remaining||0,P=+d.rate||0,r=(+d.zins||0)/1200;if(B<=0)return {done:true};if(P<=0)return {none:true};
  let n;if(r>0){if(P<=r*B)return {never:true};n=Math.ceil(-Math.log(1-r*B/P)/Math.log(1+r));}else n=Math.ceil(B/P);
  const now=new Date(),end=new Date(now.getFullYear(),now.getMonth()+n,1);return {n,end,label:end.toLocaleDateString('de-DE',{month:'long',year:'numeric'})};}
function payoffText(d){const p=payoff(d);if(p.done)return '<span style="color:var(--good)">Abbezahlt</span>';
  const cur=iso(new Date()).slice(0,7);
  if(+d.planAmount>0&&d.planMonth){const rest=Math.max((+d.remaining||0)-(+d.planAmount),0);
    if(d.planMonth<cur)return `<span style="color:var(--warn)">Geplante Zahlung von ${money0(d.planAmount)} im ${esc(ymLabel(d.planMonth))} ist noch nicht eingetragen.</span>`;
    const pre=`Geplant: <b>${money0(Math.min(d.planAmount,d.remaining))}</b> im <b>${esc(ymLabel(d.planMonth))}</b>`;
    if(rest<=0)return pre+', damit ist alles abbezahlt.';
    if(p.none)return pre+`, danach noch <b>${money0(rest)}</b> offen.`;}
  if(p.none)return 'Keine feste Rate. Zahlungen trägst du ein, wenn du sie machst.';if(p.never)return '<span style="color:var(--bad)">Die Rate deckt nicht mal die Zinsen</span>';return `Noch ${p.n} ${p.n===1?'Rate':'Raten'}, schuldenfrei ca. im <b>${esc(p.label)}</b>`;}
const fmtIn=v=>(+v?String(v).replace('.',','):'');

function vPlan(){
  const m=calc();
  return `${sampleBanner()}
  <section class="card"><h2>So sieht dein Monat aus</h2><div class="calc" id="calcbox">${calcBox(m)}</div></section>
  ${editor('income','Einnahmen','Gehalt, Ausbildungsvergütung, Kindergeld, Nebenjob. Alles, was regelmäßig reinkommt.')}
  ${editor('fixed','Fixkosten','Miete, Strom, Handy, Versicherungen, Ticket. Geht jeden Monat gleich ab.')}
  ${editor('subs','Abos','Streaming, Gaming, Cloud. Jahresabos werden auf den Monat umgerechnet.')}
  ${debtEditor()}
  ${catEditor()}
  ${editor('budgets','Budgets','Was du dir pro Monat für den Alltag einplanst. Die Übersicht zeigt, wie weit du schon bist.')}
  <section class="card"><h2>Deine Daten</h2>
    <p class="muted small">Alles bleibt nur auf diesem Gerät gespeichert. Kopier dir ab und zu ein Backup, z. B. in die Notizen-App.</p>
    <div class="two"><button class="btn-ghost" data-act="backup">Backup kopieren</button><button class="btn-ghost" data-act="showimport">Backup einspielen</button></div>
    <div id="importbox" hidden style="display:flex;flex-direction:column;gap:10px"><textarea id="importtxt" rows="4" placeholder="Backup-Text hier einfügen"></textarea><button class="btn" data-act="import">Einspielen</button></div>
    <textarea id="backuptxt" rows="4" readonly hidden></textarea>
    <button class="${armed==='all'?'btn-danger':'btn-ghost'}" data-act="wipe">${armed==='all'?'Wirklich alles löschen?':'Alle Daten löschen'}</button>
  </section>`;
}
function calcBox(m){return `<div><span>Einnahmen</span><span class="num">${money(m.income)}</span></div><div><span>− Fixkosten</span><span class="num">${money(m.fixed)}</span></div><div><span>− Abos</span><span class="num">${money(m.subs)}</span></div>${m.rates>0?`<div><span>− Raten</span><span class="num">${money(m.rates)}</span></div>`:''}${m.planned2>0?`<div><span>− Geplante Rückzahlung</span><span class="num">${money(m.planned2)}</span></div>`:''}${m.saving>0?`<div><span>− Sparen</span><span class="num">${money(m.saving)}</span></div>`:''}<div class="tot"><span>Frei für den Alltag</span><span class="num">${money(m.free)}</span></div><div><span>− Budgets</span><span class="num">${money(m.budgets)}</span></div><div class="tot" style="color:${m.buffer<0?'var(--bad)':'var(--good)'}"><span>${m.buffer<0?'Fehlt dir':'Kannst du sparen'}</span><span class="num">${money(Math.abs(m.buffer))}</span></div>`;}

function goalView(m){
  const g=S.goal;if(!(+g.amount>0))return `<p class="muted">Leg ein Ziel fest, zum Beispiel einen neuen PC, Urlaub oder einen Notgroschen. Hier siehst du dann, wie weit du schon bist.</p>`;
  const saved=+g.saved||0, amt=+g.amount, pct=Math.min(saved/amt*100,100), rest=Math.max(amt-saved,0);
  const thisMonth=(g.log||[]).filter(x=>x.date.startsWith(m.ym)).reduce((a,x)=>a+x.amount,0);
  let msg;
  if(pct>=100)msg='<b>Ziel erreicht!</b> Du hast es durchgezogen. Gönn dir, wofür du gespart hast, oder setz dir direkt das nächste Ziel.';
  else if(saved<=0)msg='Der erste Euro ist der wichtigste. Leg los!';
  else if(pct<25)msg='Guter Anfang. Jeder Euro bringt dich näher ran.';
  else if(pct<50)msg='Ein Viertel ist geschafft. Bleib dran!';
  else if(pct<75)msg='Über die Hälfte geschafft. Jetzt nicht nachlassen!';
  else msg=`Fast geschafft! Nur noch <b class="num">${money0(rest)}</b>.`;
  let fc='';
  if(pct<100){
    if(m.goalMonthly>0){const n=Math.ceil(rest/m.goalMonthly),end=new Date(m.now.getFullYear(),m.now.getMonth()+n,1),endYm=iso(end).slice(0,7);
      fc=`Mit <b class="num">${money0(m.goalMonthly)}</b> im Monat hast du es im <b>${esc(ymLabel(endYm))}</b> geschafft.`;
      if(g.by){fc+=endYm<=g.by?` <span style="color:var(--good)">Das ist rechtzeitig für ${esc(ymLabel(g.by))}.</span>`:` <span style="color:var(--warn)">Für ${esc(ymLabel(g.by))} bräuchtest du ${money0(rest/Math.max((+g.by.slice(0,4)-m.now.getFullYear())*12+(+g.by.slice(5)-1-m.now.getMonth()),1))} im Monat.</span>`;}}
    else if(g.by){const months=Math.max((+g.by.slice(0,4)-m.now.getFullYear())*12+(+g.by.slice(5)-1-m.now.getMonth()),1);fc=`Bis ${esc(ymLabel(g.by))} brauchst du <b class="num">${money0(rest/months)}</b> im Monat. Markier unten einen Sparplan mit „Ziel“, dann rechnet die App mit.`;}
    else fc='Markier unten einen Sparplan mit „Ziel“, dann siehst du, wann du es schaffst.';}
  const marks=[25,50,75].map(x=>`<b class="${pct>=x?'hit':''}" style="left:${x}%"></b>`).join('');
  const conf=g.confirmed&&g.confirmed[m.ym];
  return `<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="goalpct num">${Math.floor(pct)} %</span><span class="small muted" style="text-align:right"><span class="num" style="color:var(--ink);font-size:16px">${money0(saved)}</span><br>von ${money0(amt)}</span></div>
    <div><div class="goalbar" role="progressbar" aria-valuenow="${Math.floor(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i>${marks}</div>
    <div class="miles">${[25,50,75,100].map(x=>`<span class="${pct>=x?'hit':''}">${x} %</span>`).join('')}</div></div>
    <p>${msg}${thisMonth>0?` <span class="pill good">diesen Monat +${money0(thisMonth)}</span>`:''}</p>
    ${fc?`<p class="small muted">${fc}</p>`:''}
    ${pct<100?`${m.goalMonthly>0?(conf?`<p class="small" style="color:var(--good);font-weight:600">Sparrate für ${esc(monthName(m.now))} ist eingezahlt.</p>`:`<button class="btn" data-act="goalmonth">Sparrate für ${esc(monthName(m.now))} eingezahlt (+${money0(m.goalMonthly)})</button>`):''}
    <div class="erow" style="grid-template-columns:1fr auto"><input class="money num" inputmode="decimal" id="goal-dep" placeholder="Anderer Betrag €" aria-label="Einzahlung"><button class="btn-ghost" data-act="goaldep">Einzahlen</button></div>`
    :`<button class="btn-ghost" data-act="goalnew">Neues Ziel setzen</button>`}`;
}
function saveEditor(){
  const rows=S.saves.map(it=>`<div class="erow" style="grid-template-columns:1fr 5.6em auto auto"><input data-k="saves" data-id="${it.id}" data-f="name" value="${esc(it.name)}" placeholder="z. B. Tagesgeld, ETF" aria-label="Name"><input class="money" inputmode="decimal" data-k="saves" data-id="${it.id}" data-f="amount" value="${fmtIn(it.amount)}" placeholder="0,00" aria-label="Betrag pro Monat"><button class="tog${it.goal?' on':''}" data-act="togglegoal" data-id="${it.id}" aria-pressed="${it.goal?'true':'false'}" title="Zählt fürs Sparziel">Ziel</button><button class="x" data-act="delrow" data-k="saves" data-id="${it.id}" aria-label="Zeile löschen">×</button></div>`).join('');
  return `<section class="card"><div class="card-head"><h2>Was du schon anlegst</h2></div><p class="muted small">Daueraufträge aufs Tagesgeld, ETF-Sparpläne und Ähnliches. Das wird jeden Monat wie Fixkosten vom Gehalt abgezogen. Mit „Ziel“ markierst du, was in dein Sparziel fließt.</p><div class="rows" style="gap:8px">${rows}</div>
  <button class="btn-line" data-act="addrow" data-k="saves">+ Sparplan hinzufügen</button>
  <div class="sumline"><span>Pro Monat</span><span class="num" data-total="saves">${money(sum(S.saves))}</span></div></section>`;

function vSparen(){
  const m=calc(), tips=[];
  const add=(st,html)=>tips.push(`<div class="tip"><span class="mark" style="background:var(--${st})"></span><p>${html}</p></div>`);
  const open=S.debts.filter(d=>+d.remaining>0);
  if(open.length){const top=[...open].sort((a,b)=>(+b.zins||0)-(+a.zins||0))[0];
    if(open.length>1&&+top.zins>0)add('warn',`Du hast mehrere Schulden. Zahl zuerst <b>${esc(top.name||'die teuerste')}</b> ab, die hat mit <b>${String(top.zins).replace('.',',')} %</b> den höchsten Zins. Jeder Euro dort spart dir am meisten.`);
    else if(+top.zins>=8)add('warn',`<b>${esc(top.name||'Deine Schulden')}</b> kosten dich <b>${String(top.zins).replace('.',',')} %</b> Zinsen. Das ist teuer. Bevor du sparst, lohnt es sich meist mehr, das zuerst abzuzahlen.`);
    if(m.buffer>0&&+top.rate>0){const fast=payoff(Object.assign({},top,{rate:+top.rate+m.buffer})),slow=payoff(top);if(slow.n&&fast.n&&slow.n-fast.n>0)add('good',`Wenn du deinen Puffer von <b class="num">${money0(m.buffer)}</b> jeden Monat zusätzlich in <b>${esc(top.name||'deine Schulden')}</b> steckst, bist du <b>${slow.n-fast.n} ${slow.n-fast.n===1?'Monat':'Monate'}</b> früher schuldenfrei.`);}
    open.filter(d=>debtPlan(d,m.ym)>0).forEach(d=>add('warn',`Diesen Monat ist deine geplante Rückzahlung an <b>${esc(d.name||'deine Schulden')}</b> dran: <b class="num">${money0(debtPlan(d,m.ym))}</b>. Trag sie unter Plan ein, sobald du sie überwiesen hast.`));
    if(open.some(d=>payoff(d).never))add('bad','Bei mindestens einer Schuld ist die Rate kleiner als die Zinsen. Dann wird sie nie weniger. Sprich mit dem Geldgeber über eine höhere Rate.');}
  if(m.extra>0)add('good',`Du hast diesen Monat <b class="num">${money0(m.extra)}</b> extra bekommen. Leg am besten mindestens die Hälfte davon direkt aufs Sparkonto, bevor sie im Alltag verschwindet.`);
  if(m.income>0){
    if(m.buffer>0)add('good',`Nach Fixkosten, Abos und Budgets bleiben dir <b class="num">${money0(m.buffer)}</b> im Monat übrig. Richte am Monatsanfang einen <b>Dauerauftrag</b> über diesen Betrag aufs Tagesgeldkonto ein, dann gibst du es gar nicht erst aus.`);
    else if(m.buffer<0)add('bad',`Deine Budgets sind <b class="num">${money0(-m.buffer)}</b> größer als das, was nach Fixkosten übrig bleibt. Kürz zuerst die Budgets, sonst gehst du jeden Monat ins Minus.`);
    const fs=(m.fixed+m.subs)/m.income;
    if(fs>.55)add('warn',`Fixkosten und Abos fressen <b>${Math.round(fs*100)} %</b> deines Einkommens. Hier lohnt sich ein Check am meisten: Handy, Strom und Versicherungen kannst du oft für weniger bekommen.`);
  }
  const subsY=S.subs.reduce((s,x)=>s+monthly(x),0)*12;
  if(S.subs.length){const top=[...S.subs].sort((a,b)=>monthly(b)-monthly(a)).slice(0,2);
    add('warn',`Deine Abos kosten zusammen <b class="num">${money0(subsY)}</b> im Jahr. Ohne ${top.map(t=>'<b>'+esc(t.name||'?')+'</b>').join(' und ')} hättest du <b class="num">${money0(top.reduce((s,x)=>s+monthly(x),0)*12)}</b> mehr. Tipp: Streaming-Abos abwechselnd statt gleichzeitig laufen lassen.`);}
  S.budgets.filter(b=>+b.amount>0).forEach(b=>{const sp=m.catMonth[b.cat]||0;if(sp>b.amount)add('bad',`<b>${esc(b.cat)}</b>: Budget diesen Monat schon um <b class="num">${money0(sp-b.amount)}</b> überzogen.`);else if(m.day>=7&&sp/m.day*m.dim>b.amount*1.05)add('warn',`<b>${esc(b.cat)}</b>: Bei deinem Tempo landest du bei etwa <b class="num">${money0(sp/m.day*m.dim)}</b> statt ${money0(b.amount)}.`);});
  const cats=Object.entries(m.cat30).sort((a,b)=>b[1]-a[1]);
  if(cats.length)add('warn',`Am meisten ging zuletzt für <b>${esc(cats[0][0])}</b> drauf: <b class="num">${money0(cats[0][1])}</b> in 30 Tagen. Schon 20 % weniger wären <b class="num">${money0(cats[0][1]*.2*12)}</b> im Jahr.`);
  const small=m.last30.filter(t=>t.amount<10);
  if(small.length>=6)add('warn',`<b>${small.length} Kleinkäufe</b> unter 10 € in 30 Tagen, zusammen <b class="num">${money0(sum(small))}</b>. Kleinkram fällt einzeln nicht auf, summiert sich aber.`);
  const eat=m.cat30['Essen gehen']||0;
  if(eat>60)add('warn',`<b class="num">${money0(eat)}</b> für Essen gehen und Lieferdienste in 30 Tagen. Zwei Mal pro Woche vorkochen spart da schnell die Hälfte.`);
  // 50/30/20
  let ratio='';
  if(m.income>0){const needs=m.fixed+m.rates, wants=m.subs+Math.max(m.budgets,m.spent), save=m.saving+Math.max(m.income-needs-wants-m.saving,0);
    const rl=(lab,v,target,c)=>{const p=v/m.income*100;return `<div class="rline"><div class="brow-top small"><span><b>${lab}</b> <span class="muted">Ziel ${target} %</span></span><span class="num">${Math.round(p)} % · ${money0(v)}</span></div><div class="rtrack"><i style="width:${Math.min(p,100)}%;background:${c}"></i><em style="left:${target}%"></em></div></div>`;};
    ratio=`<section class="card"><div class="card-head"><h2>Die 50-30-20-Regel</h2></div><p class="muted small">Eine bekannte Faustregel: die Hälfte fürs Nötige, knapp ein Drittel für Spaß, ein Fünftel zum Sparen. Der Strich zeigt das Ziel.</p><div class="ratio">${rl('Nötig (Fixkosten + Raten)',needs,50,'var(--c6)')}${rl('Wünsche (Abos + Budgets)',wants,30,'var(--c1)')}${rl('Sparen',save,20,'var(--c2)')}</div></section>`;}
  const g=S.goal;
  return `${sampleBanner()}
  <section class="card" style="gap:16px">
    <div class="card-head"><div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Sparziel</span><h2>${esc(g.name||'Dein Sparziel')}</h2></div></div>
    <div id="goalres" style="display:flex;flex-direction:column;gap:14px">${goalView(m)}</div>
    <details class="edit"${+g.amount>0?'':' open'}><summary>${+g.amount>0?'Ziel bearbeiten':'Ziel festlegen'}</summary><div class="inner">
      <div class="two"><label class="f">Wofür?<input data-goal="name" value="${esc(g.name||'')}" placeholder="z. B. Urlaub"></label><label class="f">Bis wann? (optional)<input type="month" data-goal="by" value="${esc(g.by||'')}"></label></div>
      <div class="two"><label class="f">Zielbetrag €<input class="num" inputmode="decimal" data-goal="amount" value="${fmtIn(g.amount)}" placeholder="0,00"></label><label class="f">Schon gespart €<input class="num" inputmode="decimal" data-goal="saved" value="${fmtIn(g.saved)}" placeholder="0,00"></label></div>
    </div></details>
  </section>
  ${saveEditor()}
  <section class="hero"><span class="eyebrow">Zusätzlich sparbar pro Monat</span><div class="big${m.buffer<0?' neg':''}" id="bufnum">${money0(m.buffer)}</div><p class="muted">Was nach Fixkosten, Abos, Raten, Sparplänen und Budgets noch übrig bleibt.</p></section>
  <section class="card"><h2>Was dir auffällt</h2><div>${tips.join('')||'<p class="muted">Trag ein paar Ausgaben und deinen Plan ein, dann erscheinen hier Hinweise.</p>'}</div></section>
  ${ratio}
  <section class="card"><h2>An mehr Geld kommen</h2><ul class="ideas">
    <li><b>Sachen verkaufen</b><span>Alte Konsolen, Spiele, Klamotten oder Technik bei Kleinanzeigen oder Vinted. Bringt oft schnell ein paar hundert Euro.</span></li>
    <li><b>Steuererklärung machen</b><span>Wer angestellt ist, bekommt oft Geld zurück, z. B. für Fahrtkosten oder Arbeitsmittel. Mit Elster oder einer Steuer-App geht das ohne Berater.</span></li>
    <li><b>Minijob oder Nebenjob</b><span>Ein paar Stunden pro Woche, z. B. Gastro, Lager oder Nachhilfe. Bei einem Minijob bleibt der Verdienst für dich meist abgabenfrei.</span></li>
    <li><b>Verträge wechseln</b><span>Strom, Handy und Versicherungen jedes Jahr vergleichen. Neukunden zahlen oft deutlich weniger als Bestandskunden.</span></li>
    <li><b>Erspartes verzinsen</b><span>Geld auf dem Girokonto bringt meist nichts. Ein Tagesgeldkonto zahlt Zinsen und du kommst trotzdem jederzeit ran.</span></li>
  </ul><p class="muted small">Allgemeine Ideen, keine persönliche Finanzberatung.</p></section>`;
}

/* ---------- Kategorie-Details ---------- */
let detailCat=null;
function donut(segs,center){
  const r=54,C=2*Math.PI*r,total=segs.reduce((a,x)=>a+x.v,0);let off=0;
  const arcs=total>0?segs.map(sg=>{const len=sg.v/total*C,gap=segs.length>1?2:0;const el=`<circle r="${r}" cx="75" cy="75" fill="none" stroke="${sg.c}" stroke-width="18" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"></circle>`;off+=len;return el;}).join(''):'';
  return `<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Kuchendiagramm nach Läden"><circle r="${r}" cx="75" cy="75" fill="none" stroke="var(--sunk)" stroke-width="18"></circle>${arcs}<text x="75" y="72" text-anchor="middle" font-family="var(--f-display)" font-weight="700" font-size="22" fill="var(--ink)">${esc(center[0])}</text><text x="75" y="92" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(center[1])}</text></svg>`;
}
function vCat(name){
  const m=calc(), col=catColor(name);
  const mt=S.tx.filter(t=>t.cat===name&&t.date.startsWith(m.ym)).sort((a,b)=>b.date.localeCompare(a.date));
  const spent=sum(mt), bd=S.budgets.find(x=>x.cat===name&&+x.amount>0), bud=bd?+bd.amount:0;
  const pd=new Date(m.now.getFullYear(),m.now.getMonth()-1,1),pym=iso(pd).slice(0,7),pdim=new Date(pd.getFullYear(),pd.getMonth()+1,0).getDate();
  const prevSame=sum(S.tx.filter(t=>t.cat===name&&t.date>=pym+'-01'&&t.date<=pym+'-'+pad(Math.min(m.day,pdim))));
  // nach Laden
  const g={};mt.forEach(t=>{const k=(t.note||'Ohne Notiz').trim();const key=k.toLowerCase();g[key]=g[key]||{n:k,v:0,c:0};g[key].v+=+t.amount;g[key].c++;});
  let shops=Object.values(g).sort((a,b)=>b.v-a.v);if(shops.length>5){const rest=shops.slice(4);shops=shops.slice(0,4);shops.push({n:'Rest',v:rest.reduce((a,x)=>a+x.v,0),c:rest.reduce((a,x)=>a+x.c,0)});}
  const pal=['var(--c0)','var(--c1)','var(--c2)','var(--c5)','var(--c7)'];shops.forEach((x,i)=>x.col=x.n==='Rest'?'var(--c7)':pal[i%4]);
  const center=bud?[money0(spent),'von '+money0(bud)]:[money0(spent),'diesen Monat'];
  const legend=shops.length?shops.map(x=>`<div style="display:flex;align-items:center;gap:8px;font-size:14px;min-width:0"><span class="dot" style="background:${x.col}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)} <span class="muted small">${x.c}×</span></span><span class="num small">${money0(x.v)}</span></div>`).join(''):'<p class="muted small">Diesen Monat noch nichts in dieser Kategorie.</p>';
  // Status
  let status='';
  if(bud){const left=bud-spent,proj=m.day>=5?spent/m.day*m.dim:0;
    if(left<0)status=`<span style="color:var(--bad)">Budget um <b class="num">${money0(-left)}</b> überzogen.</span>`;
    else{status=`Noch <b class="num">${money(left)}</b> übrig, das sind <b class="num">${money(left/m.daysLeft)}</b> pro Tag.`;if(proj>bud*1.05)status+=` <span style="color:var(--warn)">Bei deinem Tempo landest du bei etwa ${money0(proj)}.</span>`;}}
  else status='Für diese Kategorie hast du kein Budget. Unter Plan kannst du eins festlegen.';
  // Vergleich
  let cmp='–',cmpCol='var(--muted)';if(prevSame>0){const d=(spent-prevSame)/prevSame*100;cmp=(d>0?'+':'')+Math.round(d)+' %';cmpCol=d>5?'var(--bad)':d<-5?'var(--good)':'var(--muted)';}else if(spent>0){cmp='neu';}
  const big=mt.length?Math.max(...mt.map(t=>+t.amount)):0;
  // 6 Monate
  const months=[];for(let k=5;k>=0;k--){const d=new Date(m.now.getFullYear(),m.now.getMonth()-k,1),y=iso(d).slice(0,7);months.push({l:d.toLocaleDateString('de-DE',{month:'short'}).replace('.',''),v:sum(S.tx.filter(t=>t.cat===name&&t.date.startsWith(y))),now:k===0});}
  const mx=Math.max(...months.map(x=>x.v),bud,1);
  const mbars=`<div class="mbars">${bud?`<div class="line" style="bottom:${21+bud/mx*90}px"><span>Budget ${money0(bud)}</span></div>`:''}${months.map(x=>`<div class="wk${x.now?' now':''}"><span class="v num">${x.v?money0(x.v):''}</span><div class="col" style="height:${Math.max(x.v/mx*90,3)}px;background:${bud&&x.v>bud?'var(--bad)':col};opacity:${x.now?1:.45}"></div><span class="k">${esc(x.l)}</span></div>`).join('')}</div>`;
  return `<div class="grab"></div>
  <div class="card-head" style="align-items:center"><div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="dot" style="background:${col};width:14px;height:14px;border-radius:4px"></span><h2 style="font-size:22px">${esc(name)}</h2></div><button class="x" data-act="closecat" id="closecat" aria-label="Schließen" style="font-size:24px">×</button></div>
  <div class="donutwrap">${donut(shops.map(x=>({v:x.v,c:x.col})),center)}<div style="display:flex;flex-direction:column;gap:8px;min-width:0;width:100%">${legend}</div></div>
  ${bud?`<div class="track" style="height:10px"><i style="width:${Math.min(spent/bud*100,100)}%;background:${spent>bud?'var(--bad)':col}"></i></div>`:''}
  <p style="font-size:14.5px">${status}</p>
  <div class="stats">
    <div class="stat"><span>Einkäufe</span><b class="num">${mt.length}</b></div>
    <div class="stat"><span>Ø pro Einkauf</span><b class="num">${money(mt.length?spent/mt.length:0)}</b></div>
    <div class="stat"><span>Größter Einkauf</span><b class="num">${money(big)}</b></div>
    <div class="stat"><span>vs. Vormonat bis Tag ${m.day}</span><b class="num" style="color:${cmpCol}">${cmp}</b></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px"><h3>Letzte 6 Monate</h3>${mbars}</div>
  <div style="display:flex;flex-direction:column;gap:4px"><h3>Einkäufe im ${esc(monthName(m.now))}</h3>${mt.length?`<div class="list">${mt.map(t=>`<div class="item"><span class="dot" style="background:${col}"></span><div class="txt"><b>${esc(t.note||name)}</b><span>${dayLabel(t.date)}</span></div><span class="num">${money(t.amount)}</span></div>`).join('')}</div>`:'<p class="muted small">Noch keine Einträge.</p>'}</div>
  <a class="btn" href="#ausgaben" data-act="closecat" style="text-decoration:none;text-align:center">Ausgabe in ${esc(name)} eintragen</a>`;
}
let lastFocus=null;
function openCat(name){detailCat=name;lastFocus=document.activeElement;lastCat=name;const sh=document.getElementById('sheet');sh.innerHTML=`<div class="back" data-act="closecat"></div><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(name)}">${vCat(name)}</div>`;sh.hidden=false;document.body.style.overflow='hidden';const c=document.getElementById('closecat');c&&c.focus();}
function closeCat(){detailCat=null;const sh=document.getElementById('sheet');sh.hidden=true;sh.innerHTML='';document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detailCat)closeCat();else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}});

/* ---------- Steuerung ---------- */
const views={uebersicht:vOverview,ausgaben:vAusgaben,plan:vPlan,sparen:vSparen};
let tab='uebersicht';
const app=document.getElementById('app');
function render(keepScroll){
  const y=window.scrollY;
  app.innerHTML=views[tab]();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.toggleAttribute('aria-current',false)||a.dataset.tab===tab&&a.setAttribute('aria-current','page'));
  if(keepScroll)window.scrollTo(0,y);
}
function route(){if(detailCat)closeCat();const h=location.hash.slice(1);tab=views[h]?h:'uebersicht';armed=null;render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800);}
function touch(){if(S.sample){/* Änderungen an Beispieldaten machen sie zu eigenen */}save();}

document.addEventListener('submit',e=>{
  if(e.target.id!=='txform')return;e.preventDefault();
  const a=parseAmount(document.getElementById('tx-amount').value);
  if(!(a>0)){toast('Gib einen Betrag größer als 0 ein');return;}
  const cat=(e.target.querySelector('input[name=cat]:checked')||{}).value||'Sonstiges';lastCat=cat;
  S.tx.push({id:uid(),date:document.getElementById('tx-date').value||iso(new Date()),amount:a,cat,note:document.getElementById('tx-note').value.trim()});
  prefill=null;touch();render(true);toast(money(a)+' eingetragen');
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='opencat'){openCat(b.dataset.cat);return;}
  if(act==='closecat'){closeCat();return;}
  if(!['deltx','wipe','delcat','delextra','deldebt'].includes(act))armed=null;
  if(act==='deltx'){const id=b.dataset.id;if(armed===id){S.tx=S.tx.filter(t=>t.id!==id);armed=null;touch();toast('Gelöscht');}else armed=id;render(true);}
  else if(act==='addrow'){const k=b.dataset.k;S[k].push(k==='saves'?{id:uid(),name:'',amount:0,goal:true}:k==='budgets'?{id:uid(),cat:catNames().find(c=>!S.budgets.some(x=>x.cat===c))||'Sonstiges',amount:0}:{id:uid(),name:'',amount:0,interval:'monat'});touch();render(true);const ins=app.querySelectorAll(`[data-k="${k}"][data-f="${k==='budgets'?'amount':'name'}"]`);ins.length&&ins[ins.length-1].focus();}
  else if(act==='apok'){justAdded=null;render(true);toast('Gespeichert');}
  else if(act==='apundo'){S.tx=S.tx.filter(t=>t.id!==justAdded);justAdded=null;touch();render(true);toast('Wieder entfernt');}
  else if(act==='showextra'){document.getElementById('extraform').hidden=false;b.hidden=true;document.getElementById('ex-note').focus();}
  else if(act==='addextra'){const a=parseAmount(document.getElementById('ex-amount').value);if(!(a>0)){toast('Gib einen Betrag größer als 0 ein');return;}S.extra.push({id:uid(),date:document.getElementById('ex-date').value||iso(new Date()),amount:a,note:document.getElementById('ex-note').value.trim()});touch();render(true);toast('+'+money(a)+' eingetragen');}
  else if(act==='delextra'){const id=b.dataset.id;if(armed==='ex'+id){S.extra=S.extra.filter(t=>t.id!==id);armed=null;touch();toast('Gelöscht');}else armed='ex'+id;render(true);}
  else if(act==='togglegoal'){const it=S.saves.find(x=>x.id===b.dataset.id);if(it){it.goal=!it.goal;touch();render(true);}}
  else if(act==='goalmonth'){const m=calc();const g=S.goal;g.saved=Math.round(((+g.saved||0)+m.goalMonthly)*100)/100;g.confirmed=g.confirmed||{};g.confirmed[m.ym]=true;(g.log=g.log||[]).push({date:iso(new Date()),amount:m.goalMonthly});touch();render(true);toast('+'+money0(m.goalMonthly)+' fürs Ziel. Stark!');}
  else if(act==='goaldep'){const a=parseAmount((document.getElementById('goal-dep')||{}).value||'');if(!(a>0)){toast('Gib einen Betrag größer als 0 ein');return;}const g=S.goal;g.saved=Math.round(((+g.saved||0)+a)*100)/100;(g.log=g.log||[]).push({date:iso(new Date()),amount:a});touch();render(true);toast('+'+money(a)+' fürs Ziel');}
  else if(act==='goalnew'){S.goal={name:'',amount:0,saved:0,by:''};touch();render();}
  else if(act==='adddebt'){S.debts.push({id:uid(),name:'',remaining:0,total:0,rate:0,zins:0});touch();render(true);const ins=app.querySelectorAll('[data-debt][data-f="name"]');const l=ins[ins.length-1];l&&l.focus();}
  else if(act==='deldebt'){const id=b.dataset.id;if(armed==='debt'+id){S.debts=S.debts.filter(d=>d.id!==id);armed=null;touch();toast('Gelöscht');}else armed='debt'+id;render(true);}
  else if(act==='paycustom'){const d=S.debts.find(x=>x.id===b.dataset.id);const inp=document.getElementById('pay-'+b.dataset.id);const a=parseAmount(inp?inp.value:'');if(!d)return;if(!(a>0)){toast('Gib einen Betrag größer als 0 ein');return;}
    d.remaining=Math.max(Math.round(((+d.remaining||0)-a)*100)/100,0);const cur=iso(new Date()).slice(0,7);if(d.planMonth&&d.planMonth<=cur){d.planAmount=0;d.planMonth='';}touch();render(true);toast(d.remaining>0?'Noch '+money(d.remaining)+' offen':'Abbezahlt!');}
  else if(act==='payrate'){const d=S.debts.find(x=>x.id===b.dataset.id);if(d){const r=+d.zins>0?Math.round(d.remaining*d.zins/1200*100)/100:0;const pay=Math.min(+d.rate,+d.remaining+r);d.remaining=Math.max(Math.round((+d.remaining+r-pay)*100)/100,0);touch();render(true);toast(d.remaining>0?'Noch '+money(d.remaining)+' offen':'Abbezahlt!');}}
  else if(act==='addcat'){const used=S.cats.map(c=>c.c);let col=0;while(used.includes(col)&&col<NCOL-1)col++;S.cats.push({id:uid(),name:'Neue Kategorie',c:col});touch();render(true);const ins=app.querySelectorAll('[data-cat]');const l=ins[ins.length-1];if(l){l.focus();l.select();}}
  else if(act==='cyclecolor'){const c=S.cats.find(x=>x.id===b.dataset.id);if(c){c.c=(c.c+1)%NCOL;touch();render(true);}}
  else if(act==='delcat'){const id=b.dataset.id;if(armed==='cat'+id){const c=S.cats.find(x=>x.id===id);if(c){if(S.cats.length<=1){toast('Mindestens eine Kategorie muss bleiben');}else{S.cats=S.cats.filter(x=>x.id!==id);let fb=S.cats.find(x=>x.name==='Sonstiges');if(!fb&&S.tx.some(t=>t.cat===c.name)){fb={id:uid(),name:'Sonstiges',c:7};S.cats.push(fb);}S.tx.forEach(t=>{if(t.cat===c.name)t.cat=fb.name;});S.budgets=S.budgets.filter(x=>x.cat!==c.name);toast('Kategorie gelöscht');}}armed=null;touch();}else armed='cat'+id;render(true);}
  else if(act==='delrow'){const k=b.dataset.k;S[k]=S[k].filter(x=>x.id!==b.dataset.id);touch();render(true);}
  else if(act==='fresh'){S=blank();save();location.hash='#plan';render();toast('Leg los mit deinem Plan');}
  else if(act==='wipe'){if(armed==='all'){S=blank();armed=null;save();toast('Alles gelöscht');}else armed='all';render(true);}
  else if(act==='backup'){const txt=JSON.stringify(S);const ta=document.getElementById('backuptxt');
    const fallback=()=>{ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast('Text markiert, jetzt kopieren');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Backup kopiert'),fallback);}catch(err){fallback();}}
  else if(act==='showimport'){const box=document.getElementById('importbox');box.hidden=!box.hidden;}
  else if(act==='import'){try{const d=JSON.parse(document.getElementById('importtxt').value);if(!d||!Array.isArray(d.tx)||!Array.isArray(d.fixed))throw 0;S=Object.assign(blank(),d);save();render();toast('Backup eingespielt');}catch(err){toast('Das ist kein gültiges Backup');}}
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.k){const it=S[el.dataset.k].find(x=>x.id===el.dataset.id);if(!it)return;const f=el.dataset.f;
    if(f==='amount'){const v=parseAmount(el.value);it.amount=isFinite(v)?v:0;}else it[f]=el.value;
    touch();const k=el.dataset.k,tot=app.querySelector(`[data-total="${k}"]`);
    if(tot)tot.textContent=money(k==='subs'?S.subs.reduce((s,x)=>s+monthly(x),0):sum(S[k]));
    const cb=document.getElementById('calcbox');if(cb)cb.innerHTML=calcBox(calc());
    if(k==='saves'){const mm=calc();const gr=document.getElementById('goalres');if(gr)gr.innerHTML=goalView(mm);const bn=document.getElementById('bufnum');if(bn)bn.textContent=money0(mm.buffer);}}
  else if(el.dataset.debt){const d=S.debts.find(x=>x.id===el.dataset.debt);if(!d)return;const f=el.dataset.f;
    if(f==='name'||f==='planMonth')d[f]=el.value;else{const v=parseAmount(el.value);d[f]=isFinite(v)?v:0;if(f==='remaining')d.total=Math.max(+d.total||0,d[f]);}
    touch();const pe=app.querySelector(`[data-payoff="${d.id}"]`);if(pe)pe.innerHTML=payoffText(d);
    const dt=app.querySelector('[data-dtotal]');if(dt)dt.textContent=money(S.debts.reduce((a,x)=>a+(+x.remaining||0),0));
    const dr=app.querySelector('[data-drates]');if(dr)dr.textContent=money(S.debts.reduce((a,x)=>a+debtRate(x),0));
    const cb=document.getElementById('calcbox');if(cb)cb.innerHTML=calcBox(calc());}
  else if(el.dataset.cat){const c=S.cats.find(x=>x.id===el.dataset.cat);if(!c)return;const old=c.name,nw=el.value;S.tx.forEach(t=>{if(t.cat===old)t.cat=nw;});S.budgets.forEach(x=>{if(x.cat===old)x.cat=nw;});c.name=nw;touch();}
  else if(el.id==='paid'){const v=parseAmount(el.value);if(el.value.trim()===''||!isFinite(v))delete S.paid[iso(new Date()).slice(0,7)];else S.paid[iso(new Date()).slice(0,7)]=v;touch();}
  else if(el.dataset.goal){const f=el.dataset.goal;S.goal=S.goal||{};S.goal[f]=(f==='amount'||f==='saved')?(parseAmount(el.value)||0):el.value;touch();
    const gr=document.getElementById('goalres');if(gr)gr.innerHTML=goalView(calc());}
});
document.addEventListener('change',e=>{if(e.target.name==='apcat'){const t=S.tx.find(x=>x.id===justAdded);if(t){t.cat=e.target.value;touch();toast('Kategorie: '+t.cat);}return;}if(e.target.dataset&&e.target.dataset.cat){render(true);return;}if(e.target.id==='paid'){render(true);toast('Gehalt gespeichert');return;}if(e.target.tagName==='SELECT'&&e.target.dataset.k)e.target.dispatchEvent(new Event('input',{bubbles:true}));});

/* ---------- Zahlungen vom Kurzbefehl (Apple Pay) ---------- */
function handleIncoming(){
  let q;try{q=new URLSearchParams(location.search);}catch(e){return;}
  if(!q.has('betrag')&&!q.has('wo'))return;
  const raw=(q.get('betrag')||'').trim(), note=(q.get('wo')||'').trim(), a=parseAmount(raw);
  try{history.replaceState(null,'',location.pathname+'#ausgaben');}catch(e){location.hash='#ausgaben';}
  const sig=raw+'|'+note, now=Date.now();
  try{const l=JSON.parse(localStorage.getItem(KEY+'.last')||'null');if(l&&l.sig===sig&&now-l.t<120000)return;localStorage.setItem(KEY+'.last',JSON.stringify({sig,t:now}));}catch(e){}
  if(!(a>0)){prefill={note};return;}
  const prev=[...S.tx].reverse().find(t=>t.note&&note&&t.note.toLowerCase()===note.toLowerCase());
  const names=catNames(), cat=prev&&names.includes(prev.cat)?prev.cat:(names.includes('Sonstiges')?'Sonstiges':names[0]);
  const t={id:uid(),date:iso(new Date()),amount:a,cat,note,ap:true};S.tx.push(t);save();justAdded=t.id;
}
handleIncoming();
route();
})();
</script>
